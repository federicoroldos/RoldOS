<!doctype html>
<html><head><meta charset="utf-8"><title>RoldOS tiles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="promo.css">
<style>
  body { width: 1600px; height: 900px; padding: 86px 110px; }
  h2 { font: 700 62px/1.12 var(--display); max-width: 1300px; letter-spacing: -0.035em; margin: 0; }
  p { font: 400 30px/1.4 var(--ui); color: var(--muted); margin: 18px 0 0; max-width: 1100px; }
  .grid { display: grid; grid-template-columns: repeat(3, 352px); gap: 34px 44px; margin-top: 62px; }
</style></head>
<body>
  <h2>Quickly access your most important features</h2>
  <p>Calibration, inputs and casting live right on the home screen.</p>
  <div class="grid" id="grid"></div>
  <script src="tiles.js"></script>
  <script>document.getElementById('grid').innerHTML = ROLDOS_ORDER.map(k => roldosTile(k, false)).join('');</script>
</body></html>
