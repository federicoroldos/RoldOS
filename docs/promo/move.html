<!doctype html>
<html><head><meta charset="utf-8"><title>RoldOS move favorites</title>

</head><body class="stack" style="height:700px">
  <div><h2>Configure your homescreen <i>to your specific liking</i></h2></div>
  <div class="flow" id="s" style="gap:30px"></div>
  <script>
    document.getElementById('s').innerHTML =
      shotCrop('shots/menu-youtube.png', 582, 262, 756, 556, 430, { radius: 40 })
      + '<span class="to">→</span>'
      + shotCrop('shots/moving-youtube.png', 80, 200, 1028, 470, 860);
  </script>
