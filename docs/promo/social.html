<!doctype html>
<html><head><meta charset="utf-8"><title>RoldOS social preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="promo.css">
<!-- GitHub "Social preview" (the card Discord, WhatsApp, etc. show for the repo link).
     1280x640; upload docs/images/roldos-social.png in the repo's Settings > Social preview. -->
<style>
  body { width: 1280px; height: 640px; position: relative; }
  .copy { position: absolute; left: 88px; top: 50%; transform: translateY(-50%); z-index: 3; }
  .wm { font-size: 124px; }
  .tag { font: 400 38px/1.25 var(--ui); margin-top: 30px; max-width: 520px; }
  .tag b { color: var(--dot); font-weight: 700; }
  /* Tiles: a tilted wall bleeding off the right edge, like the home screen glimpsed in motion. */
  .wall { position: absolute; left: 600px; top: -150px; display: flex; gap: 30px;
    transform: rotate(-10deg); transform-origin: top left; }
  .col { display: flex; flex-direction: column; gap: 28px; }
  .col:nth-child(2) { margin-top: 113px; } .col:nth-child(3) { margin-top: 226px; }
  .shade { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(90deg, var(--bg) 0, var(--bg) 640px, rgba(20,21,22,0) 820px); }
</style></head>
<body>
  <div class="wall" id="wall"></div>
  <div class="shade"></div>
  <div class="copy">
    <div class="wm">Rold<i>OS</i></div>
    <div class="tag">Custom <b>light</b> and <b>fast</b> AndroidTV launcher.</div>
  </div>
  <script src="tiles.js"></script>
  <script>
    const cols = [['wl', 'cal', 'wd', 'home'], ['home', 'set', 'hdmi', 'cal'], ['hdmi', 'wd', 'wl', 'set']];
    document.getElementById('wall').innerHTML = cols.map((c, ci) =>
      '<div class="col">' + c.map((k, i) => roldosTile(k, ci === 1 && i === 1)).join('') + '</div>').join('');
  </script>
</body></html>
