<!doctype html>
<html><head><meta charset="utf-8"><title>RoldOS close all apps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="promo.css">
<script src="shots.js"></script>
<!-- Crops of two real screenshots taken seconds apart: the focused button (shots/close-focus.png)
     and the notice after pressing it with Netflix, Disney+, Prime Video, TizenTube and Spotify
     open (shots/closed.png): 146 MB freed, available memory 234 -> 402 MB. -->
</head><body class="stack" style="height:410px">
  <div><h2>Close all apps <i>at once</i></h2></div>
  <div class="flow" id="s"></div>
  <script>
    document.getElementById('s').innerHTML =
      shotCrop('shots/close-focus.png', 1458, 72, 356, 90, 330, { radius: 45 })
      + '<span class="to">→</span>'
      + shotCrop('shots/closed.png', 458, 903, 1002, 96, 938, { radius: 48 });
  </script>
</body></html>
