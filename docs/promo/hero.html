<!doctype html>
<html><head><meta charset="utf-8"><title>RoldOS hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&family=Roboto:wght@500&display=swap">
<link rel="stylesheet" href="promo.css">
<style>
  body { width: 1600px; height: 760px; }
  .copy { position: absolute; left: 110px; top: 96px; }
  .wm { font-size: 230px; }
  .tag { font: 500 52px/1.15 var(--display); letter-spacing: -0.02em; margin-top: 34px; }
  .tag b { color: var(--dot); font-weight: 600; }
  .sub { font: 400 28px/1.4 var(--display); color: var(--muted); margin-top: 18px; }
  .row { position: absolute; left: 110px; top: 486px; display: flex; gap: 30px; }
  .cap { position: absolute; left: 110px; top: 712px; font: 500 26px var(--ui); color: #fff; opacity: .9; }
</style></head>
<body>
  <div class="copy">
    <div class="wm">roldos<i>.</i></div>
    <div class="tag">Your TV, <b>light</b> and <b>fast</b>.</div>
    <div class="sub">A tiny home screen for Android TV.</div>
  </div>
  <div class="row" id="row"></div>
  <div class="cap">Calibration</div>
  <script src="tiles.js"></script>
  <script>document.getElementById('row').innerHTML = ROLDOS_ORDER.map((k, i) => roldosTile(k, i === 0)).join('');</script>
</body></html>
