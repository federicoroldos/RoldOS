<!doctype html>
<html><head><meta charset="utf-8"><title>RoldOS brand assets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&display=swap">
<style>
  /* Renders one asset per ?a= value; render-brand.ps1 trims transparent edges.
     Brand (choice T1): Unbounded Bold, white "Rold" + amber "OS".
     wordmark: transparent background (top bar, left of the clock)
     icon:     "RO" (amber O) on a graphite rounded square (app icon) */
  html, body { margin: 0; background: transparent; }
  .wm { font: 700 110px/1 "Unbounded", sans-serif; letter-spacing: -0.03em; color: #fff; padding: 20px; display: inline-block; white-space: nowrap; }
  .wm i { font-style: normal; color: #ffb547; }
  .icon { width: 192px; height: 192px; border-radius: 44px; background: #141516; display: grid; place-items: center; }
  .icon .wm { font-size: 82px; padding: 0 0 4px 0; letter-spacing: -0.04em; }
</style></head>
<body>
  <div id="out"></div>
  <script>
    const a = new URLSearchParams(location.search).get('a') || 'wordmark';
    document.getElementById('out').innerHTML = a === 'icon'
      ? '<div class="icon"><span class="wm">R<i>O</i></span></div>'
      : '<span class="wm">Rold<i>OS</i></span>';
  </script>
</body></html>
